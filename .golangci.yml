version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - revive
    - misspell
    - modernize
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
